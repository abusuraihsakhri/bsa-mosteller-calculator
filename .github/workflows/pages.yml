name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify browser calculator
        run: |
          node --check assets/app.js
          node tests/web_smoke.cjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed application
        run: |
          SITE="https://abusuraihsakhri.github.io/bsa-mosteller-calculator/"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors "$SITE" -o /tmp/index.html
          grep -q "Body Surface Area Calculator" /tmp/index.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "${SITE}assets/app.js" -o /tmp/app.js
          grep -q "calculateRecord" /tmp/app.js
          echo "Live GitHub Pages smoke test passed: $SITE"
