name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m pytest -q

      - name: CLI batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          python - <<'PY'
          import csv
          with open("out_smoke.csv", newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert rows
          assert rows[0]["bsa_mosteller"]
          assert rows[0]["primary_bsa"]
          assert rows[0]["gfr_indexed_1_73m2"]
          print(f"Batch smoke test passed with {len(rows)} records")
          PY
          rm -f out_smoke.csv

  browser:
    name: Browser calculator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check assets/app.js

      - name: Run browser calculation smoke tests
        run: node tests/web_smoke.cjs
