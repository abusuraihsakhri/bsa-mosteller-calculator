name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest Suite
      run: |
        python -m pytest -p no:zarr -v

    - name: CLI Batch Smoke Test
      run: |
        python cli.py batch -i sample.csv -o out_smoke.csv
        python -c "
        import csv
        with open('out_smoke.csv', 'r', encoding='utf-8') as f:
            rows = list(csv.DictReader(f))
            assert len(rows) > 0, 'No output rows generated'
            assert 'bsa_mosteller' in rows[0], 'Missing bsa_mosteller'
            assert 'primary_bsa' in rows[0], 'Missing primary_bsa'
            assert 'gfr_indexed_1_73m2' in rows[0], 'Missing gfr_indexed_1_73m2'
        print(f'Batch smoke test passed with {len(rows)} patient records!')
        "
        rm -f out_smoke.csv
